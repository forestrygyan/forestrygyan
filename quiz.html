<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forestry Gyan Quiz</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="quiz.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="quiz-page">

<!-- Background -->
<div class="bg1"></div>
<div class="bg2"></div>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

<div class="container nav-wrap">

<div class="brand">
<img src="logo rd.png" alt="">
<span>Forestry Gyan</span>
</div>

<div class="hamburger" onclick="toggleMenu()">

<span></span>
<span></span>
<span></span>

</div>

<nav class="nav-links" id="navMenu">

<a href="index.html">Home</a>
<a href="resources.html">Resources</a>
<a href="News.html">News</a>
<a href="aboutus.html">About</a>

</nav>

</div>

</header>

<!-- ================= QUIZ ================= -->

<section class="quiz-wrapper">

<div class="quiz-card">

<!-- Header -->

<div class="quiz-header">

<div>

<h1>🌲 Forestry Quiz</h1>

<p>Practice • Learn • Crack Forestry Exams</p>

</div>

<div class="timer">

<i class="fa-solid fa-clock"></i>

<span id="timer">00:00</span>

</div>

</div>

<!-- Stats -->

<div class="stats">

<div class="stat">

<span class="label">Question</span>

<h2 id="questionNo">1/1</h2>

</div>

<div class="stat">

<span class="label">Correct</span>

<h2 id="correctCount">0</h2>

</div>

<div class="stat">

<span class="label">Wrong</span>

<h2 id="wrongCount">0</h2>

</div>

<div class="stat">

<span class="label">Skipped</span>

<h2 id="skipCount">0</h2>

</div>

</div>

<!-- Progress -->

<div class="progress-box">

<div class="progress">

<div id="progress"></div>

</div>

</div>

<!-- Question -->

<div id="questionArea">

<h2 id="question">

Loading...

</h2>

</div>

<!-- Options -->

<div id="options">

</div>

<!-- Buttons -->

<div class="buttons">

<button class="prev-btn" onclick="prevQuestion()">

<i class="fa-solid fa-arrow-left"></i>

Previous

</button>

<button class="skip-btn" onclick="skipQuestion()">

Skip

</button>

<button class="next-btn" onclick="nextQuestion()">

Next

<i class="fa-solid fa-arrow-right"></i>

</button>

</div>

<!-- Footer -->

<div class="bottom">

<div id="score">

Score : 0

</div>

<button class="finish-btn"

onclick="endQuiz()">

Finish Quiz

</button>

</div>

</div>

<!-- Question Palette -->

<div class="palette">

<h3>Question Palette</h3>

<div id="paletteGrid">

<!-- JS -->

</div>

<div class="legend">

<div>

<span class="green"></span>

Answered

</div>

<div>

<span class="red"></span>

Wrong

</div>

<div>

<span class="yellow"></span>

Skipped

</div>

<div>

<span class="gray"></span>

Pending

</div>

</div>

</div>

</section>

<script>

function toggleMenu(){

document.getElementById("navMenu").classList.toggle("active");

document.querySelector(".hamburger").classList.toggle("active");

}

document.addEventListener("click",function(e){

const menu=document.getElementById("navMenu");

const burger=document.querySelector(".hamburger");

if(!menu.contains(e.target)&&!burger.contains(e.target)){

menu.classList.remove("active");

burger.classList.remove("active");

}

});

</script>

<!-- Quiz Questions -->
<script src="questions.js"></script>

<!-- Quiz Logic -->
<script src="quiz.js"></script>

</body>

</html>
