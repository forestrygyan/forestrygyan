<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pay Forestry Gyan</title>
  <link rel="stylesheet" href="main.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #064e3b;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .forest-line {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #d4f5d4;
      font-size: 18px;
      font-style: italic;
    }

    .sub-line {
      position: absolute;
      top: 50px;
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-size: 16px;
    }

    .tree {
      position: absolute;
      bottom: 0;
      width: 100px;
      height: 150px;
      background: linear-gradient(to top, #2e7d32 50%, #1b5e20 50%);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      animation: floatTree 5s ease-in-out infinite alternate;
    }

    .tree:nth-child(1) { left: 5%; animation-delay: 0s; }
    .tree:nth-child(2) { left: 20%; animation-delay: 1s; }
    .tree:nth-child(3) { left: 40%; animation-delay: 0.5s; }
    .tree:nth-child(4) { left: 60%; animation-delay: 1.5s; }
    .tree:nth-child(5) { left: 80%; animation-delay: 2s; }

    @keyframes floatTree {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .container {
      background: linear-gradient(145deg, #ffffff, #d4f5d4);
      border-radius: 20px;
      padding: 25px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      text-align: center;
      z-index: 2;
    }

    h2 {
      color: #2d7a2d;
      margin-bottom: 20px;
    }

    .qr-img {
      width: 200px;
      height: 200px;
      margin: 10px auto;
      border-radius: 16px;
      border: 2px solid #4caf50;
      object-fit: cover;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .upi-id {
      margin: 15px 0 5px;
      font-size: 18px;
      color: #2c3e50;
      word-break: break-word;
    }

    .copy-btn {
      background: #ffc107;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 5px;
      font-size: 14px;
      display: inline-block;
      color: #fff;
      font-weight: bold;
      transition: background 0.3s;
    }

    .copy-btn:hover {
      background: #e0a800;
    }

    .note {
      font-size: 15px;
      color: #555;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="forest-line">"Forests are the lungs of our planet — conserve them for a greener tomorrow."</div>
  <div class="sub-line">Forestry Gyan – Promoting Forestry Education for a Sustainable Future</div>

  <!-- Animated Trees -->
  <div class="tree"></div>
  <div class="tree"></div>
  <div class="tree"></div>
  <div class="tree"></div>
  <div class="tree"></div>

  <div class="container">
    <h2>Support Forestry Gyan</h2>

    <!-- QR Image -->
    <img src="https://api.qrserver.com/v1/create-qr-code/?data=upi://pay?pa=aryansen9876@oksbi&pn=Aryan+Sen&cu=INR&size=200x200" alt="UPI QR Code" class="qr-img" />

    <!-- UPI ID -->
    <div class="upi-id">
      UPI ID: <strong>aryansen9876@oksbi</strong>
      <div class="copy-btn" onclick="copyUPI()">Copy</div>
      <hr>
    

    </div>

    <p class="note">Scan the QR code or copy the UPI ID to make a payment using any UPI app.</p>
  </div>

  <script>
    function copyUPI() {
      navigator.clipboard.writeText("aryansen9876@oksbi").then(() => {
        alert("UPI ID copied to clipboard!");
      });
    }
  </script>

</body>
</html>
